name: 버그 신고
description: 개인정보를 제외한 최소 재현으로 Pwh 문제를 알려 주세요.
body:
  - type: markdown
    attributes:
      value: 보안 취약점은 공개 이슈 대신 SECURITY.md의 신고 경로를 이용해 주세요. 실제 문서·AI 토큰·세션 URL·복구본은 첨부하지 마세요.
  - type: input
    id: version
    attributes:
      label: 버전과 환경
      description: Pwh / Desktop 버전, Windows 버전, AI 연결 종류를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 순서와 실제 결과
      description: 빈 문서나 개인정보를 제거한 합성 문서를 기준으로 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 자료 확인
      options:
        - label: 실문서·자격증명·세션 토큰과 개인 경로를 공개하지 않았습니다.
          required: true
