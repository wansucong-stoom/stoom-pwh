name: macOS Desktop
on:
  push:
    branches: [main, 'codex/macos-desktop-*']
    tags: ['macos-preview-*']
    paths:
      - '.github/workflows/macos-desktop.yml'
      - 'desktop/**'
      - 'client/**'
      - 'src/**'
      - 'packaging/macos/**'
      - 'scripts/**'
      - 'package.json'
      - 'runtime-lock.json'
      - 'docs/MACOS.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release draft to receive the verified Apple Silicon package
        required: false

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease && !contains(join(github.event.release.assets.*.name, ' '), '-macos-arm64.zip'))
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.release.tag_name || inputs.release_tag) && format('refs/tags/{0}', github.event.release.tag_name || inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node desktop/verify-source.mjs
      - run: node --test tests/macos-desktop.test.mjs
      - name: Stage the pinned verification runtime
        if: github.ref_name == 'codex/macos-desktop-menu-validation-20261124'
        run: |
          cache="$RUNNER_TEMP/pwh-macos-cache"
          runtime=$(node -p 'require("./runtime-lock.json").runtime.file')
          mkdir -p "$cache"
          cp ".ci-inputs/$runtime" "$cache/$runtime"
      - name: Build and verify Apple Silicon preview
        id: pack
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/check-desktop-release-ref.mjs
          fi
          npm install --prefix "$RUNNER_TEMP/pwh-macos-tools" --no-save --package-lock=false --ignore-scripts playwright-core@1.62.1
          export PWH_MACOS_TEST_PLAYWRIGHT="$RUNNER_TEMP/pwh-macos-tools/node_modules/playwright-core/index.mjs"
          desktop=$(node -p 'require("./desktop/standalone-pwh/version.json").version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ -z "$RELEASE_TAG" ] && [ "$GITHUB_REF_NAME" != "macos-preview-$desktop" ]; then
            echo "Preview tag and Desktop version differ"
            exit 1
          fi
          asset="PwhDesktop-$desktop-macos-arm64.zip"
          node scripts/build-desktop-macos.mjs --output "$RUNNER_TEMP/$asset" --cache "$RUNNER_TEMP/pwh-macos-cache"
          echo "artifact=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: |
            ${{ runner.temp }}/${{ steps.pack.outputs.artifact }}
            ${{ runner.temp }}/${{ steps.pack.outputs.artifact }}.json
          compression-level: 0
          if-no-files-found: error

  attach-release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/macos-preview-'))
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
      - name: Attach verified Mac preview to the shared release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
          ASSET: ${{ needs.package.outputs.artifact }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            gh release create "$RELEASE_TAG" "$ASSET" "$ASSET.json" \
              --verify-tag --prerelease --latest=false \
              --title "Pwh Desktop Mac 시험판 $RELEASE_TAG" \
              --notes-file docs/MACOS.md
          else
            gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.json"
          fi
