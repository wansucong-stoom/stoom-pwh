name: Test
on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-inputs:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.inputs.outputs.available }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: inputs
        run: node scripts/check-ci-release-inputs.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test
      - run: node scripts/verify-editor-build.mjs --check-inputs
      - run: node desktop/verify-source.mjs
  wasm-table-regressions:
    needs: runtime-inputs
    if: needs.runtime-inputs.outputs.available == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/setup.mjs --runtime-root "$env:RUNNER_TEMP/pwh-wasm-regression-runtime"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust source-test compiler installation failed' }
          node scripts/prepare-core-regressions.mjs --work-root "$env:RUNNER_TEMP/pwh-core-regression-inputs"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned core regression input preparation failed' }
      - shell: pwsh
        run: |
          $env:PWH_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'pwh-wasm-regression-runtime'
          $inputs = Get-Content (Join-Path $env:RUNNER_TEMP 'pwh-core-regression-inputs/environment.json') -Raw | ConvertFrom-Json
          $env:PWH_ENGINE_SOURCE = $inputs.PWH_ENGINE_SOURCE
          $env:PWH_REFERENCE_CORE_JS = $inputs.PWH_REFERENCE_CORE_JS
          $env:PWH_REFERENCE_CORE_WASM = $inputs.PWH_REFERENCE_CORE_WASM
          $env:PWH_FLOAT_FRAME_BASE_JS = $inputs.PWH_FLOAT_FRAME_BASE_JS
          $env:PWH_FLOAT_FRAME_BASE_WASM = $inputs.PWH_FLOAT_FRAME_BASE_WASM
          $env:PWH_RUSTC = (rustup which --toolchain 1.93.1 rustc)
          $env:RUSTC = $env:PWH_RUSTC
          node scripts/run-ci-tests.mjs core
  browser-regressions:
    needs: runtime-inputs
    if: needs.runtime-inputs.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/setup.mjs --runtime-root "$env:RUNNER_TEMP/pwh-browser-runtime"
      - shell: pwsh
        run: |
          $toolsRoot = Join-Path $env:RUNNER_TEMP 'pwh-browser-tools'
          npm install --prefix $toolsRoot --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
          node (Join-Path $toolsRoot 'node_modules/playwright/cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
          $env:PWH_PLAYWRIGHT_MODULE = ([Uri](Join-Path $toolsRoot 'node_modules/playwright/index.mjs')).AbsoluteUri
          $env:PWH_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'pwh-browser-runtime'
          node scripts/run-ci-tests.mjs browser
  reproducible-editors:
    needs: runtime-inputs
    if: needs.runtime-inputs.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pwh-build-downloads
          key: pwh-build-inputs-${{ hashFiles('runtime-lock.json') }}
      - run: npm ci --prefix tools/quality --ignore-scripts --no-audit --no-fund
      - run: node scripts/verify-editor-build.mjs --typecheck --cache-dir "$env:RUNNER_TEMP/pwh-build-downloads"
  static-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/quality/package-lock.json
      - run: npm ci --prefix tools/quality --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: node tools/quality/check-rules.mjs
  render-comparison-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-render-compare.txt
      - run: python tests/compare-pages.test.py
  store-submit:
    needs: [runtime-inputs, test, wasm-table-regressions, browser-regressions, reproducible-editors, static-checks, render-comparison-tests]
    if: github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v') && vars.MSSTORE_AUTOPUBLISH == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: microsoft-store
    concurrency:
      group: pwh-microsoft-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Store connection
        shell: pwsh
        env:
          MSSTORE_IDENTITY_JSON: ${{ secrets.MSSTORE_IDENTITY_JSON }}
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          foreach ($key in @('MSSTORE_IDENTITY_JSON','MSSTORE_TENANT_ID','MSSTORE_CLIENT_ID','MSSTORE_CLIENT_SECRET','MSSTORE_SELLER_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) { throw "Missing Store secret: $key" }
          }
      - run: node scripts/setup.mjs --runtime-root "$env:RUNNER_TEMP/pwh-store-runtime"
      - name: Verify released Store package
        id: package
        shell: pwsh
        env:
          MSSTORE_IDENTITY_JSON: ${{ secrets.MSSTORE_IDENTITY_JSON }}
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $sdk = Get-ChildItem -LiteralPath $sdkRoot -Directory | Where-Object { $_.Name -match '^10\.0\.\d+\.0$' } | Sort-Object { [Version]$_.Name } -Descending | Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'x64/makeappx.exe') } | Select-Object -First 1
          if (!$sdk) { throw 'Windows SDK makeappx.exe is required' }
          $env:PWH_WINDOWS_SDK_DIR = Join-Path $sdk.FullName 'x64'
          $env:PWH_RUNTIME_ROOT = Join-Path $env:RUNNER_TEMP 'pwh-store-runtime'
          node scripts/store-release.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Store release verification failed' }
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Submit verified package to Microsoft Store
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
          PWH_STORE_PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Store authentication failed' }
          msstore publish $env:PWH_STORE_PACKAGE --appId 9NXGD60MHMT2
          if ($LASTEXITCODE -ne 0) { throw 'Store submission failed; inspect Partner Center before retrying' }
          '### Store update submitted' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          'Microsoft certification and publication remain separate from this upload.' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-package-verification
          path: ${{ runner.temp }}/pwh-store-release/verification.json
          if-no-files-found: ignore
