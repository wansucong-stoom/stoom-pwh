name: Linux Desktop
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable Pwh release tag
        required: true
permissions:
  contents: read
concurrency:
  group: linux-desktop-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease && !contains(join(github.event.release.assets.*.name, ' '), '-linux-x64.tar.gz'))
    runs-on: ubuntu-24.04
    outputs:
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify shared release version
        id: versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: node scripts/check-desktop-release-ref.mjs
      - run: node desktop/verify-source.mjs
      - run: node --test tests/linux-desktop.test.mjs
      - name: Build pinned Linux package
        id: build
        run: |
          asset="PwhDesktop-${{ steps.versions.outputs.desktop }}-linux-x64.tar.gz"
          node scripts/build-desktop-linux.mjs --output "$RUNNER_TEMP/$asset" --cache "$RUNNER_TEMP/pwh-cache"
          echo "artifact=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            ${{ steps.build.outputs.package }}
            ${{ steps.build.outputs.verification }}
          compression-level: 0
          if-no-files-found: error

  attach-release:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
      - name: Attach Linux package to the same release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          ASSET: ${{ needs.package.outputs.artifact }}
        run: |
          stable=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not')
          test "$stable" = true
          gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.json"
