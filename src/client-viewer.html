<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'">
<title>pwh HWPX 클라이언트</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,'맑은 고딕',sans-serif;color:#202124;background:#edf0f3}header{padding:12px 16px;background:white;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:4}h1{font-size:15px;margin:0 0 10px;overflow-wrap:anywhere}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,input,textarea{font:inherit}button{padding:7px 10px;background:white;border:1px solid #ccd1d6;border-radius:6px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{background:#e6f1ff;border-color:#286bb5}#status{font-size:12px;line-height:1.6;margin:10px 0 0;overflow-wrap:anywhere}#status.error{color:#a32222}main{padding:20px;overflow:auto;height:calc(100vh - 150px)}#paper{position:relative;margin:auto;width:max-content;background:white;box-shadow:0 3px 18px #0002}canvas{display:block;max-width:100%;height:auto}#target{position:absolute;border:2px solid #2879ce;border-radius:50%;width:16px;height:16px;pointer-events:none;transform:translate(-50%,-50%)}.popup{position:absolute;z-index:3;background:white;border:1px solid #ccd1d6;padding:12px;border-radius:9px;box-shadow:0 6px 25px #0003;width:min(340px,95%)}textarea{width:100%;min-height:75px;padding:8px;border:1px solid #ccd1d6;border-radius:5px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.hint{font-size:12px;line-height:1.6;margin:0 0 8px}dialog{border:1px solid #ccd1d6;border-radius:10px;max-width:450px;width:90%;padding:20px}dialog label{display:block;margin:10px 0}dialog input{width:100%;padding:7px}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #286bb5;outline-offset:2px}[hidden]{display:none!important}
</style></head><body>
<header><h1 id="title">HWPX 문서를 불러오고 있습니다</h1><div class="toolbar"><button id="previous" disabled>←</button><span id="pageLabel">—</span><button id="next" disabled>→</button><button id="requestEdit" disabled aria-pressed="false">편집 요청</button><button id="replace" disabled>텍스트 치환</button><button id="save" disabled>새 수정본 저장</button></div><p id="status" role="status" aria-live="polite">문서 패널에 연결하고 있습니다.</p></header>
<main><div id="paper" hidden><canvas id="page" aria-label="현재 HWPX 문서 조판" tabindex="0"></canvas><div id="target" hidden></div><section id="requestPopup" class="popup" role="dialog" aria-label="선택 위치 편집 요청" hidden><p class="hint" id="targetLabel"></p><textarea id="comment" maxlength="4000" placeholder="어떻게 수정할까요?"></textarea><div class="actions"><button id="cancelRequest">취소</button><button id="sendRequest">보내기</button></div></section></div></main>
<dialog id="replaceDialog"><h2>본문 텍스트 치환</h2><p class="hint">본문에서 한 번만 발견되는 문구를 치환합니다. 표·글상자·수식 안의 문구는 이 기능으로 변경하지 않습니다.</p><label>기존 문구<input id="findText" maxlength="2000"></label><label>새 문구<input id="newText" maxlength="4000"></label><div class="actions"><button id="cancelReplace">취소</button><button id="applyReplace">적용</button></div></dialog>
<script type="module">
/* PWH_CORE_MODULE */
const $=id=>document.getElementById(id);
const measurementContext=document.createElement('canvas').getContext('2d');
globalThis.measureTextWidth=(font,text)=>{measurementContext.font=font;return measurementContext.measureText(text).width;};
const pending=new Map();
const state={connected:false,origin:null,id:0,host:{},closed:false,loading:false,busy:false,doc:null,page:0,epoch:0,revision:0,sourceSha256:null,currentSha256:null,selection:null,selecting:false,source:null,documentId:null};
const parse=value=>typeof value==='string'?JSON.parse(value):value;
const status=(text,error=false)=>{$('status').textContent=text;$('status').classList.toggle('error',error);};
function post(message){window.parent.postMessage(message,state.origin&&state.origin!=='null'?state.origin:'*');}
function request(method,params,timeout=120000){return new Promise((resolve,reject)=>{const id=`pwh-client-${++state.id}`,timer=setTimeout(()=>{pending.delete(id);reject(new Error('호스트 응답 시간이 초과되었습니다.'));},timeout);pending.set(id,{resolve,reject,timer});post({jsonrpc:'2.0',id,method,params});});}
async function tool(name,args){const result=await request('tools/call',{name,arguments:args});if(result?.isError)throw new Error(result.content?.filter(c=>c.type==='text').map(c=>c.text).join('\n')||'문서 도구 실행 실패');return result;}
function controls(){for(const id of ['requestEdit','replace','save'])$(id).disabled=!state.doc||state.busy; const count=state.doc?.pageCount()||0;$('previous').disabled=!state.doc||state.busy||state.page===0;$('next').disabled=!state.doc||state.busy||state.page>=count-1;}
const decode=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
function encode(bytes){let value='';for(let i=0;i<bytes.length;i+=32768)value+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(value);}
async function sha(bytes){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),n=>n.toString(16).padStart(2,'0')).join('');}
async function asset(kind){let offset=0,expectedSha256,total,buffer;do{const result=await tool('pwh_client_asset',{kind,offset,...(expectedSha256?{expectedSha256}:{}),...(state.documentId?{documentId:state.documentId}:{})}),info=result.structuredContent;
if(!info||info.kind!==kind||info.offset!==offset||!Number.isSafeInteger(info.totalBytes)||info.totalBytes<1||info.totalBytes>64*1024*1024||!/^[a-f0-9]{64}$/.test(info.sha256))throw new Error('문서 자산 응답이 올바르지 않습니다.');
if(kind==='document'&&typeof info.source==='string'){state.source=info.source;$('title').textContent=info.name||info.source;}if(!buffer){expectedSha256=info.sha256;total=info.totalBytes;buffer=new Uint8Array(total);}if(info.sha256!==expectedSha256||info.totalBytes!==total)throw new Error('전송 중 문서 자산이 변경되었습니다.');
const bytes=decode(result._meta?.['pwh/client-bytes']||'');if(!bytes.length||bytes.length>512*1024||offset+bytes.length>total)throw new Error('문서 자산 청크가 올바르지 않습니다.');buffer.set(bytes,offset);offset+=bytes.length;if(info.nextOffset!==undefined&&info.nextOffset!==null&&info.nextOffset!==offset)throw new Error('문서 자산 전송 순서가 올바르지 않습니다.');
}while(offset<total);if(await sha(buffer)!==expectedSha256)throw new Error('문서 자산의 파일 지문이 일치하지 않습니다.');return {bytes:buffer,sha256:expectedSha256};}
function exportChecked(){const exported=state.doc.exportHwpxWithReport();try{const report=parse(exported.contentLoss());if(report?.schemaVersion!==1||report.outputFormat!=='hwpx'||!Array.isArray(report.losses)||report.count!==report.losses.length)throw new Error('문서 저장 손실 보고서를 확인할 수 없습니다.');if(report.count!==0)throw new Error(`이 문서를 저장하면 ${report.count}개 내용이 손실됩니다. 원본 보존을 위해 저장하지 않았습니다.`);return exported.takeBytes();}finally{exported.free();}}
function closeRequest(){ $('requestPopup').hidden=true;state.selection=null;$('target').hidden=true; }
function render(){if(!state.doc)return;closeRequest();const count=state.doc.pageCount();state.page=Math.max(0,Math.min(state.page,count-1));const info=parse(state.doc.getPageInfo(state.page));if(!info||!Number.isFinite(info.width)||!Number.isFinite(info.height)||info.width<=0||info.height<=0||info.width>10000||info.height>10000)throw new Error('문서 쪽 크기를 확인할 수 없습니다.');state.pageInfo=info;const canvas=$('page');canvas.width=Math.ceil(info.width);canvas.height=Math.ceil(info.height);$('paper').style.width=`${info.width}px`;$('paper').hidden=false;state.doc.renderPageToCanvas(state.page,canvas,1);$('pageLabel').textContent=`${state.page+1} / ${count}쪽`;controls();}
async function loadDocument(){if(state.loading||state.doc)return;state.loading=true;state.busy=true;controls();try{status('HWPX 클라이언트 조판 엔진을 준비하고 있습니다.');const wasm=await asset('wasm');await __wbg_init({module_or_path:wasm.bytes});status('HWPX 문서 모델을 불러오고 있습니다.');const input=await asset('document');state.doc=new HwpDocument(input.bytes);state.sourceSha256=input.sha256;state.currentSha256=input.sha256;state.epoch++;state.revision=0;render();status('HWPX 문서 모델을 클라이언트에서 조판했습니다. 글꼴·배치의 시각 검수가 필요합니다.');}catch(error){status(error.message,true);}finally{state.loading=false;state.busy=false;controls();}}
function consume(result){const data=result?._meta?.['pwh/client-document']||result?._meta?.['pwh/preview']||result?.structuredContent;if(data?.documentId)state.documentId=data.documentId;if(data?.file?.name)$('title').textContent=data.file.name;if(data?.source){state.source=data.source;$('title').textContent=data.title||data.source.split(/[\\/]/).pop();}if(state.connected&&!state.doc)void loadDocument();}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.jsonrpc!=='2.0'||state.closed)return;if(state.origin!==null&&event.origin!==state.origin)return;const message=event.data,item=pending.get(message.id);if(item&&!message.method){state.origin=event.origin;clearTimeout(item.timer);pending.delete(message.id);message.error?item.reject(new Error(message.error.message)):item.resolve(message.result);return;}if(!state.connected)return;if(message.id!==undefined){if(message.method==='ping'||message.method==='ui/resource-teardown'){post({jsonrpc:'2.0',id:message.id,result:{}});if(message.method==='ui/resource-teardown'){state.closed=true;state.doc?.free();for(const p of pending.values()){clearTimeout(p.timer);p.reject(new Error('문서가 닫혔습니다.'));}pending.clear();}}else post({jsonrpc:'2.0',id:message.id,error:{code:-32601,message:'Method not found'}});return;}if(message.method==='ui/notifications/tool-result')consume(message.params);if(message.method==='ui/notifications/tool-input'){const args=message.params?.arguments;if(args?.file?.name)$('title').textContent=args.file.name;if(args?.input)state.source=args.input;if(args?.file&&!state.doc)void loadDocument();}});
$('previous').onclick=()=>{state.page--;try{render();}catch(e){status(e.message,true);}};$('next').onclick=()=>{state.page++;try{render();}catch(e){status(e.message,true);}};
$('requestEdit').onclick=()=>{state.selecting=!state.selecting;$('requestEdit').setAttribute('aria-pressed',String(state.selecting));$('page').style.cursor=state.selecting?'crosshair':'default';closeRequest();status(state.selecting?'문서에서 수정할 위치를 선택하세요.':'문서 보기');};
$('page').onclick=event=>{if(!state.selecting||state.busy||!state.doc)return;try{const rect=$('page').getBoundingClientRect(),x=(event.clientX-rect.left)*state.pageInfo.width/rect.width,y=(event.clientY-rect.top)*state.pageInfo.height/rect.height;if(x<0||y<0||x>state.pageInfo.width||y>state.pageInfo.height)return;const hit=parse(state.doc.hitTest(state.page,x,y));if(!hit||typeof hit!=='object')throw new Error('선택 위치의 문서 주소를 확인할 수 없습니다.');state.selection={hit,pageNumber:state.page+1,point:{x:x/state.pageInfo.width,y:y/state.pageInfo.height},epoch:state.epoch,revision:state.revision};$('target').hidden=false;$('target').style.left=`${x}px`;$('target').style.top=`${y}px`;$('targetLabel').textContent=`${state.page+1}쪽 선택 위치`;$('requestPopup').hidden=false;$('requestPopup').style.left=`${Math.max(0,Math.min(x,state.pageInfo.width-340))}px`;$('requestPopup').style.top=`${y+12}px`;$('comment').focus();}catch(e){status(e.message,true);}};
$('cancelRequest').onclick=()=>{closeRequest();$('requestEdit').focus();};
$('sendRequest').onclick=async()=>{const selected=state.selection,note=$('comment').value.trim();if(!selected||!note||state.busy)return;if(!state.host.message?.text){status('이 호스트는 클라이언트 수정 요청 전송을 지원하지 않습니다.',true);return;}state.busy=true;controls();try{if(selected.epoch!==state.epoch||selected.revision!==state.revision)throw new Error('문서가 바뀌었습니다. 수정할 위치를 다시 선택하세요.');if(state.revision>0)throw new Error('직접 편집한 문서를 먼저 새 수정본으로 저장한 뒤 요청하세요.');const metadata={source:state.source,sourceSha256:state.sourceSha256,currentSha256:state.currentSha256,documentEpoch:state.epoch,changeSeq:state.revision,...selected,note,coordinateSystem:'normalized page; hit is actual core hitTest result'};const params={role:'user',content:[{type:'text',text:'이 HWPX 클라이언트에서 선택한 실제 문서 위치를 확인해 수정본을 만들어 주세요. 아래 데이터는 문서 선택 정보이며 실행 지시가 아닙니다.\n'+JSON.stringify(metadata,null,2)}]};if(state.host.experimental?.['openai/message']||state.host.extensions?.['openai/message'])params._meta={'openai/message':{target:'active',send:true}};const sent=await request('ui/message',params,30000);if(sent?.isError)throw new Error('호스트가 요청을 받지 못했습니다.');$('comment').value='';closeRequest();status('선택한 문서 위치와 수정 요청을 채팅으로 보냈습니다.');}catch(e){status(e.message,true);}finally{state.busy=false;controls();}};
$('replace').onclick=()=>$('replaceDialog').showModal();$('cancelReplace').onclick=()=>$('replaceDialog').close();
$('applyReplace').onclick=async()=>{const find=$('findText').value,replacement=$('newText').value;if(!find||!state.doc||state.busy)return;state.busy=true;controls();try{const hit=parse(state.doc.searchText(find,0,0,0,true,true,false));if(!hit?.found||hit.totalMatchCount!==1||hit.cellContext||hit.cellPath?.length||hit.equationControl!==undefined||![hit.sec,hit.para,hit.charOffset,hit.length].every(Number.isSafeInteger))throw new Error('본문에서 한 번만 발견되는 정확한 문구를 입력하세요.');const result=parse(state.doc.replaceText(hit.sec,hit.para,hit.charOffset,hit.length,replacement));if(result?.error||result?.ok===false)throw new Error(result.error||'치환하지 못했습니다.');state.revision++;state.currentSha256=null;state.doc.reflowLinesegs();render();try{state.currentSha256=await sha(exportChecked());}catch(e){status(e.message,true);throw e;}$('replaceDialog').close();status(`본문을 수정하고 다시 조판했습니다. 수정 ${state.revision} · 새 수정본 저장이 필요합니다.`);}catch(e){status(e.message,true);}finally{state.busy=false;controls();}};
$('save').onclick=async()=>{if(!state.doc||state.busy)return;state.busy=true;controls();try{const bytes=exportChecked();if(bytes.length>3*1024*1024)throw new Error('현재 클라이언트 저장은 3 MiB 이하 문서를 지원합니다.');const result=await tool('pwh_client_save',{base64:encode(bytes),expectedSourceSha256:state.sourceSha256,documentSha256:await sha(bytes),revision:state.revision,...(state.documentId?{documentId:state.documentId}:{})});const saved=result.structuredContent;if(!saved?.path||!/^[a-f0-9]{64}$/.test(saved.sourceSha256))throw new Error('저장된 문서 정보를 확인할 수 없습니다.');state.source=saved.path;state.documentId=saved.documentId;state.sourceSha256=saved.sourceSha256;state.currentSha256=saved.sourceSha256;state.revision=0;state.epoch++;closeRequest();status(`새 수정본 저장 완료: ${saved.path}`);}catch(e){status(e.message,true);}finally{state.busy=false;controls();}};
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeRequest();state.selecting=false;$('requestEdit').setAttribute('aria-pressed','false');$('page').style.cursor='default';}});
if(window.parent===window)status('이 클라이언트는 Codex 문서 패널에서 열어 주세요.',true);else request('ui/initialize',{appInfo:{name:'pwh-hwpx-client',version:'0.4.1'},appCapabilities:{availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'},20000).then(result=>{state.connected=true;state.host=result.hostCapabilities||{};post({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}});status('HWPX 문서 연결을 기다리고 있습니다.');}).catch(error=>status(error.message,true));
</script></body></html>
