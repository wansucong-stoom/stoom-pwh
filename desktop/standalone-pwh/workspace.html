<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pwh Desktop</title><link rel="icon" href="stoom.ico"><link rel="stylesheet" href="stoom-mark-original.css"><link rel="stylesheet" href="stoom-product-marks.css"><link rel="stylesheet" href="workspace.css"></head>
<body><header class="workspace-header"><button id="workspace-home" class="workspace-brand" type="button" aria-label="시작 화면"><span class="workspace-wordmark">Pwh Desktop</span></button><div id="tabs" role="tablist" aria-label="열린 문서"></div><button id="new-tab" type="button" aria-label="새 문서 탭" title="새 문서 탭">＋</button><span id="workspace-status" role="status"></span><button id="codex-plugin-retry" type="button" hidden>Codex 연결 다시 시도</button><button id="workspace-update" type="button" hidden></button></header>
<main id="documents">
  <section id="home-view" class="home-view" aria-labelledby="home-title" hidden>
    <div class="home-content">
      <div class="home-intro"><p class="home-eyebrow">STOOM · PWH DESKTOP</p><h1 id="home-title" tabindex="-1">어떤 문서를 작업할까요?</h1><p>새 문서를 만들거나 최근 작업을 이어서 열어보세요.</p></div>
      <div class="home-actions" aria-label="문서 시작">
        <button id="home-new" class="home-action" type="button"><span class="home-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 14h6M12 11v6"/></svg></span><span><strong>새 문서</strong><small>빈 문서에서 시작하기</small></span><span class="home-arrow" aria-hidden="true">→</span></button>
        <button id="home-open" class="home-action" type="button"><span class="home-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3zM3 7V5h7l2 2"/></svg></span><span><strong>문서 열기</strong><small>PC에서 HWP·HWPX 선택</small></span><span class="home-arrow" aria-hidden="true">→</span></button>
      </div>
      <section class="home-recents" aria-labelledby="home-recent-title"><div class="home-section-heading"><div><h2 id="home-recent-title">최근 문서</h2><p>이 PC에서 열거나 저장한 문서</p></div><button id="home-refresh" type="button" title="최근 문서 새로고침" aria-label="최근 문서 새로고침"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 6M19 4v4h-4"/></svg></button></div><p id="home-status" role="status"></p><div id="home-recent-list" class="home-recent-list"></div><div id="home-empty" class="home-empty" hidden><span class="home-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg></span><strong>최근 문서가 없습니다</strong><span>문서를 열면 여기에 표시됩니다.</span></div></section>
    </div>
  </section>
</main><script src="workspace.js"></script></body></html>
