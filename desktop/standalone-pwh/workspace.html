<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pwh Desktop</title><link rel="icon" href="stoom.ico"><link rel="stylesheet" href="stoom-mark-original.css"><link rel="stylesheet" href="stoom-product-marks.css"><link rel="stylesheet" href="workspace.css"></head>
<body><header class="workspace-header"><button id="workspace-home" class="workspace-brand" type="button" aria-label="시작 화면"><span class="workspace-wordmark">Pwh Desktop</span></button><div id="tabs" role="tablist" aria-label="열린 문서"></div><button id="new-tab" type="button" aria-label="새 문서 탭" title="새 문서 탭">＋</button><span id="workspace-status" role="status"></span><button id="codex-plugin-retry" type="button" hidden>Codex 연결 다시 시도</button><button id="workspace-update" type="button" hidden></button></header>
<main id="documents">
  <section id="home-view" class="home-view" aria-labelledby="home-title" hidden>
    <div class="home-content">
      <div class="home-intro"><p class="home-eyebrow">STOOM · PWH DESKTOP</p><h1 id="home-title" tabindex="-1">어떤 문서를 작업할까요?</h1><p>새 문서를 만들거나 최근 작업을 이어서 열어보세요.</p></div>
      <div class="home-actions" aria-label="문서 시작">
        <button id="home-new" class="home-action" type="button"><span class="home-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 14h6M12 11v6"/></svg></span><span><strong>새 문서</strong><small>빈 문서에서 시작하기</small></span><span class="home-arrow" aria-hidden="true">→</span></button>
        <button id="home-open" class="home-action" type="button"><span class="home-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10H3zM3 7V5h7l2 2"/></svg></span><span><strong>문서 열기</strong><small>PC에서 HWP·HWPX 선택</small></span><span class="home-arrow" aria-hidden="true">→</span></button>
        <button id="home-templates" class="home-action" type="button"><span class="home-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5zM15 4v5h4M8 12h8M8 16h6"/></svg></span><span><strong>자주 쓰는 양식</strong><small>등록한 양식으로 문서 시작하기</small></span><span class="home-arrow" aria-hidden="true">→</span></button>
      </div>
      <section class="home-recents" aria-labelledby="home-recent-title"><div class="home-section-heading"><div><h2 id="home-recent-title">최근 문서</h2><p>이 PC에서 열거나 저장한 문서</p></div><button id="home-refresh" type="button" title="최근 문서 새로고침" aria-label="최근 문서 새로고침"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 6M19 4v4h-4"/></svg></button></div><p id="home-status" role="status"></p><div id="home-recent-list" class="home-recent-list"></div><div id="home-empty" class="home-empty" hidden><span class="home-empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg></span><strong>최근 문서가 없습니다</strong><span>문서를 열면 여기에 표시됩니다.</span></div></section>
    </div>
  </section>
</main>
  <dialog id="report-templates" class="workspace-close-dialog report-library" aria-labelledby="report-templates-title">
    <header><h2 id="report-templates-title">자주 쓰는 양식</h2><button id="report-templates-close" type="button" aria-label="양식 창 닫기">×</button></header>
    <div id="report-template-library">
      <div class="report-library-tools"><label id="report-template-filter-label" for="report-template-filter">양식 검색</label><input id="report-template-filter" type="search" placeholder="기관·회사 또는 양식 이름"><button id="report-template-register" type="button">양식 등록</button></div>
      <div id="report-template-list"></div>
    </div>
    <form id="report-template-form" hidden>
      <label>기관·회사<input id="report-template-organization" type="text" maxlength="80" required></label>
      <label>양식 이름<input id="report-template-name" type="text" maxlength="80" placeholder="비워 두면 파일 이름 사용"></label>
      <div class="report-template-rules">
        <label for="report-template-rules">작성 기준 <span>선택</span></label>
        <p id="report-template-rules-help">이 양식으로 AI에 문서 작성을 요청할 때 적용할 기준과 지침을 적어 주세요. 비워 두면 공통 기준이 자동으로 적용됩니다.</p>
        <textarea id="report-template-rules" aria-describedby="report-template-rules-help" rows="3" maxlength="4000" placeholder="결론을 먼저 쓰고, 일정은 날짜순으로 정리합니다."></textarea>
      </div>
      <div class="report-template-actions"><button id="report-template-register-back" type="button">목록</button><button type="submit">HWP·HWPX 파일 선택</button></div>
    </form>
    <form id="report-template-use" hidden>
      <p id="report-template-selected"></p>
      <fieldset id="report-template-mode"><legend>양식 활용 수준</legend>
        <label><input type="radio" name="report-mode" value="exact" checked> <span><strong>양식 그대로</strong><small>원본의 작성 칸을 채웁니다</small></span></label>
        <label><input type="radio" name="report-mode" value="adapt"> <span><strong>형식 준용</strong><small>대표 서식으로 새 문서 틀을 만듭니다</small></span></label>
      </fieldset>
      <div class="report-template-actions"><button id="report-template-use-back" type="button">목록</button><button type="submit">요청에 첨부</button></div>
    </form>
    <form id="report-template-remove" hidden>
      <p id="report-template-remove-name"></p>
      <p>등록 항목만 삭제합니다. 원본 파일과 이미 연 문서는 보존합니다.</p>
      <div class="report-template-actions"><button id="report-template-remove-back" type="button">취소</button><button type="submit">양식 삭제</button></div>
    </form>
    <p id="report-template-status" role="status"></p>
  </dialog>
<script src="workspace.js"></script></body></html>
